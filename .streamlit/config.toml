# Streamlit settings for this project

[server]
showEmailPrompt = false        # no "Welcome to Streamlit, enter your email" prompt

[browser]
gatherUsageStats = false       # don't send usage statistics

[client]
toolbarMode = "minimal"        # hide the Deploy button and developer menu

[theme]
base = "dark"
primaryColor = "#818CF8"
backgroundColor = "#0F1117"
secondaryBackgroundColor = "#1A1D29"
textColor = "#E5E7EB"
font = "sans serif"
